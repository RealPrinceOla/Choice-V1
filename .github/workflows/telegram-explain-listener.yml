name: M3 Telegram Explain Listener

on:
  schedule:
    - cron: '*/5 * * * *'
      timezone: 'Africa/Lagos'
  workflow_dispatch:

concurrency:
  group: m3-telegram-explain-listener
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  telegram-explain-listener:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r m3-weekly-macro-news-bot/requirements.txt

      - name: Listen for explain requests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python m3-weekly-macro-news-bot/src/telegram_listener.py
