name: M3 Telegram Explanation Cleanup

on:
  schedule:
    - cron: '*/10 * * * *'
      timezone: 'Africa/Lagos'
  workflow_dispatch:

concurrency:
  group: m3-telegram-explain-listener
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r m3-weekly-macro-news-bot/requirements.txt

      - name: Delete expired explanations
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python m3-weekly-macro-news-bot/src/cleanup_explanation.py
