name: M3 Weekly Macro News

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 0'
      timezone: 'Africa/Lagos'

permissions:
  contents: read

jobs:
  weekly-macro-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r m3-weekly-macro-news-bot/requirements.txt

      - name: Generate and send weekly macro report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python m3-weekly-macro-news-bot/src/main.py
