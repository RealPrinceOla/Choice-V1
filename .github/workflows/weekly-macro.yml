name: M3 Weekly Macro News

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 0'
      timezone: 'Africa/Lagos'

permissions:
  contents: write

jobs:
  weekly-macro-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r m3-weekly-macro-news-bot/requirements.txt

      - name: Generate and send weekly macro calendar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python m3-weekly-macro-news-bot/src/main.py

      - name: Commit refreshed calendar cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m3-weekly-macro-news-bot/data/calendar_cache.json
          git diff --cached --quiet || git commit -m "Refresh macro calendar cache"
          git push
